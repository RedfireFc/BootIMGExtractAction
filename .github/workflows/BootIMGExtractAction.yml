name: Extract boot / init_boot.img

on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: 'ROM download URL'
        required: true
        default: 'https://ultimateota.d.miui.com/OS3.0.304.0.WNKMIXM/vermeer_global-ota_full-OS3.0.304.0.WNKMIXM-user-16.0-ea3932c8f8.zip?t=1791584367&s=f4755399b91d5b88dae7a1c84a0fcb74'

permissions:
  contents: write

jobs:
  YIJIANTIQU:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get -qq install -y aria2 liblzma-dev brotli lz4 python3-pip zip > /dev/null 2>&1
          python3 -m pip install -q backports.lzma pycryptodome protobuf==3.20
          BUILD_TIME=$(TZ=Asia/Shanghai date +"%m%d%H%M")
          echo "BUILD_TIME=$BUILD_TIME" >> "$GITHUB_ENV"

      - name: 提取镜像
        shell: bash
        run: |
          set -Eeuo pipefail

          cd ~
          git clone --depth 1 https://github.com/tosasitill/Firmware_extractor.git

          cd Firmware_extractor
          aria2c -s 32 -x 16 -d . -o firmware.zip "${{ github.event.inputs.rom_url }}"
          ./extractor.sh firmware.zip

          cd "${{ github.workspace }}"
          mkdir -p extracted_images

          # Copy ALL .img files
          if ls ~/Firmware_extractor/out/*.img 1>/dev/null 2>&1; then
            cp ~/Firmware_extractor/out/*.img extracted_images/
            echo "=== Copied .img files ==="
            ls -lh extracted_images/
            echo "========================"
          fi

          # Create a zip with all extracted images
          if ls extracted_images/*.img 1>/dev/null 2>&1; then
            cd extracted_images
            zip -q ../extracted_images.zip *.img
            cd ..
            echo "Created extracted_images.zip"
            ls -lh extracted_images.zip
          fi

          {
            echo "提交日期：$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"
            echo "ROM 下载直链：${{ github.event.inputs.rom_url }}"
            if [ -f extracted_images.zip ]; then
              echo "ZIP 文件大小：$(ls -lh extracted_images.zip | awk '{print $5}')"
              echo ""
              echo "包含的文件："
              unzip -l extracted_images.zip | grep '\.img' | awk '{print $4, "(" $1 " bytes)"}'
            else
              echo "未提取到任何镜像文件"
            fi
          } > info.md

      - name: 上传镜像及相关信息
        uses: ncipollo/release-action@v1.12.0
        with:
          artifacts: "extracted_images.zip"
          bodyfile: "${{ github.workspace }}/info.md"
          tag: "OUTPUT_${{ env.BUILD_TIME }}_${{ github.run_id }}"
          token: ${{ secrets.GITHUB_TOKEN }}
